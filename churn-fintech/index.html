 "h-read":"Reading",
 "r1-t":"What the model does",
 r1:"It ranks active customers by their probability of not transacting in the next 30 days, using what is already visible in their data: whether they use the wallet less than before, how many days since their last payment, how many different uses they have, and whether their payments fail. <strong>The value is not in the AUC but in the concentration</strong>: the highest-risk decile churns 4.6 times more than average and the top 20% holds 63% of all churn. That turns a whole-base problem into a work list of 12,000 customers.",
 "r2-t":"What it does not prove",
 r2:"It predicts who leaves, not why, nor who responds to an offer. Failed payments predicting churn does not prove that fixing them prevents it; that is measured with an experiment. Knowing whom to contact requires an uplift (incremental effect) model, not just a risk model. At 30% precision, 7 of every 10 contacted were not leaving: if they get cash, it is a subsidy. Behavior shifts with the market (interoperability, seasonality, an outage), so the model degrades; calibration must be monitored monthly and the model retrained. And these data are synthetic: on real data the AUC may be lower.",
 "r3-t":"What it means for people who sell payments",
 r3:"First, concentrate effort: the retention team does not need to talk to the whole base, only to the 10%–20% the model prioritizes. Second, design the offer by segment: a cash incentive is justified only where risk and value are high; for the rest, a message that activates a second use costs six times less. Third, <strong>measure incremental value from day one</strong>: keep an uncontacted control group in every decile. Without a control there is no way to know whether retention rose because of the action or because those customers would have stayed anyway.",
 "f-t":"Sources and notes",
 f:[
  "<strong>Synthetic, illustrative data.</strong> No figure corresponds to a real employer, client or product.",
  `Dataset: ${D.n.toLocaleString("en-US")} customers active at the cutoff date (at least 1 transaction in the previous 30 days). 90-day observation window. A latent engagement variable per customer drives frequency (Poisson), recency, trend (30 days vs. prior 60), use-case diversity (binomial 1–4), ticket (lognormal), failed payments (beta with a tail), cash-out and tenure (exponential, 1–60 months). Channels: referral 30%, organic 35%, paid campaign 25%, agent 10%.`,
  "Churn: zero transactions in the 30 days after the cutoff. 30 days because a wallet is used several times a month; that window separates a normal pause from churn and leaves time to act. It is adjustable (60 or 90 days for lower-frequency products).",
  `The true churn probability is a known logistic function of the features, with non-linearities (new customers, friction × tenure interaction) and noise. Its AUC (${D.auc_oracle.toFixed(3)}) is the model's theoretical ceiling.`,

  "Test metrics: AUC-ROC, PR-AUC " + D.ap_gb.toFixed(3) + ", precision and recall with the threshold at the 80th score percentile, lift by decile and permutation importance (AUC drop, 10 repeats).",
  `Economics of acting: illustrative, unmeasured assumptions. Net revenue S/ ${A.arpu} per active customer per month, ${A.horizon}-month horizon, central save rate ${A.save*100}% (sensitivity ${A.save_lo*100}%–${A.save_hi*100}%), cost per contact S/ 0.5 (in-app message) or S/ 3 (incentive).`,
  "Cohorts: a separate simulation of 3 × 10,000 signups over 12 months, with monthly risk driven by engagement and decaying with tenure.",
  "The notebook that generates the data, trains the models and exports these results (churn.ipynb) accompanies the piece as backup for the method. The model is not trained in the browser."

let L="es";
try{const s=localStorage.getItem("lang");if(s==="en"||s==="es")L=s}catch(e){}
try{const q=new URLSearchParams(location.search).get("lang")||location.hash.slice(1);if(q==="en"||q==="es")L=q}catch(e){}
const t=k=>T[L][k];
const fmt=(v,d=0)=>v==null?null:v.toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const NS="http://www.w3.org/2000/svg";
function el(tag,a,p,txt){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;if(p)p.appendChild(e);return e}
const tip=document.getElementById("tip");
function showTip(html,cx,cy){tip.innerHTML=html;tip.hidden=false;const w=tip.offsetWidth,h=tip.offsetHeight,vw=document.documentElement.clientWidth;
  let l=cx+window.scrollX-w/2;l=Math.max(window.scrollX+8,Math.min(l,window.scrollX+vw-w-8));
  let tp=cy+window.scrollY-h-12;if(tp<window.scrollY+4)tp=cy+window.scrollY+16;tip.style.left=l+"px";tip.style.top=tp+"px"}
function hideTip(){tip.hidden=true}
function hover(svg,W,x0,x1,n,onIdx,cl){const hit=el("rect",{x:x0,y:0,width:x1-x0,height:svg.viewBox.baseVal.height,fill:"transparent"},svg);
  const mv=ev=>{const r=svg.getBoundingClientRect();const sx=(ev.clientX-r.left)*W/r.width;let k=Math.round((sx-x0)/(x1-x0)*(n-1));k=Math.max(0,Math.min(n-1,k));onIdx(k,r)};
  hit.addEventListener("pointermove",mv);hit.addEventListener("pointerdown",mv);hit.addEventListener("pointerleave",()=>{hideTip();if(cl)cl.setAttribute("visibility","hidden")})}

function drawAnchors(){
  const items=[[fmt(D.high_risk),false,"a1l","a1d"],[fmt(D.base*100,1)+"%",false,"a2l","a2d"],[D.auc_gb.toFixed(2),false,"a3l","a3d"],[fmt(D.impact.mid.saved),true,"a4l","a4d"]];
  document.getElementById("anchors").innerHTML=items.map(([v,a,l,d])=>`<div class="anchor"><span class="v${a?" acc":""}">${v}</span><span class="l">${t(l)}</span><span class="d">${t(d)}</span></div>`).join("");
}
function drawCoh(){
  const box=document.getElementById("coh");box.innerHTML="";const C=D.cohorts;
  const W=Math.max(300,box.clientWidth),narrow=W<520,m={l:34,r:narrow?10:150,t:10,b:28},H=narrow?250:290;
  const svg=el("svg",{viewBox:`0 0 ${W} ${H}`,role:"img","aria-label":t("coh-t")},box);
  const n=C.avg.length,iw=W-m.l-m.r,ih=H-m.t-m.b,x=k=>m.l+k/(n-1)*iw,y=v=>m.t+ih-v/100*ih;
  for(let v=0;v<=100;v+=25){el("line",{x1:m.l,x2:W-m.r,y1:y(v),y2:y(v),stroke:v?css("--grid"):css("--rule")},svg);el("text",{x:m.l-6,y:y(v)+4,"text-anchor":"end"},svg,v+"%")}
  for(let k=0;k<n;k+=narrow?3:1)el("text",{x:x(k),y:H-10,"text-anchor":"middle"},svg,k);
  el("text",{x:W-m.r,y:H-10,"text-anchor":"end"},svg,narrow?"":"");
  const path=a=>a.map((v,k)=>(k?"L":"M")+x(k).toFixed(1)+","+y(v).toFixed(1)).join("");
  ["c1","c2","c3"].forEach(c=>el("path",{d:path(C.base[c]),fill:"none",stroke:css("--n4"),"stroke-width":1.5},svg));
  el("path",{d:path(C.avg),fill:"none",stroke:css("--n1"),"stroke-width":2.2},svg);
  el("path",{d:path(C.avg_int),fill:"none",stroke:css("--accent"),"stroke-width":2.6},svg);
  const ends=[{txt:t("avgInt")+" "+fmt(C.avg_int[n-1],1)+"%",y:y(C.avg_int[n-1]),c:css("--accent"),w:600},{txt:t("avg")+" "+fmt(C.avg[n-1],1)+"%",y:y(C.avg[n-1]),c:css("--ink-2"),w:400}];
  if(!narrow){ends[0].y-=7;ends[1].y+=9;ends.forEach(e=>{const tx=el("text",{x:W-m.r+8,y:e.y+4},svg,e.txt);tx.style.fill=e.c;tx.style.fontWeight=e.w})}
  else{const lg=el("g",{},svg);[[t("avgInt"),"--accent"],[t("avg"),"--n1"],["Cohortes","--n4"]];}
  el("text",{x:m.l,y:H+0,"text-anchor":"start"},svg,"");
  const cl=el("line",{y1:m.t,y2:m.t+ih,stroke:css("--ink-3"),visibility:"hidden"},svg);
  hover(svg,W,m.l,W-m.r,n,(k,r)=>{cl.setAttribute("x1",x(k));cl.setAttribute("x2",x(k));cl.setAttribute("visibility","visible");
    const L2=t("cohLabels");let s=`<b>${t("month")} ${k}</b><br><span style="color:inherit">${t("avgInt")}: <b>${fmt(C.avg_int[k],1)}%</b></span><br>${t("avg")}: <b>${fmt(C.avg[k],1)}%</b>`;
    ["c1","c2","c3"].forEach(c=>s+=`<br>${L2[c]}: ${fmt(C.base[c][k],1)}%`);showTip(s,r.left+x(k)*r.width/W,r.top+y(C.avg_int[k])*r.width/W)},cl);
  if(narrow){const lg=document.createElement("div");lg.className="caption";lg.style.cssText="display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px";
    lg.innerHTML=`<span><i style="display:inline-block;width:14px;height:3px;background:var(--accent);vertical-align:middle;margin-right:6px"></i>${t("avgInt")} ${fmt(C.avg_int[n-1],1)}%</span><span><i style="display:inline-block;width:14px;height:3px;background:var(--n1);vertical-align:middle;margin-right:6px"></i>${t("avg")} ${fmt(C.avg[n-1],1)}%</span><span><i style="display:inline-block;width:14px;height:2px;background:var(--n4);vertical-align:middle;margin-right:6px"></i>${L==="es"?"Cohortes individuales":"Individual cohorts"}</span>`;box.appendChild(lg)}
  else{const lg=document.createElement("div");lg.className="caption";lg.style.marginTop="6px";lg.innerHTML=`<i style="display:inline-block;width:14px;height:2px;background:var(--n4);vertical-align:middle;margin-right:6px"></i>${L==="es"?"Líneas grises: cohortes individuales":"Grey lines: individual cohorts"} · ${t("month")} 0–12`;box.appendChild(lg)}
}
function drawImp(){
  const box=document.getElementById("imp"),mx=D.importance[0].v;
  box.innerHTML=D.importance.map((r,k)=>`<div class="irow${k<3?" top":""}" role="listitem"><span class="nm">${t("feat")[r.k]}</span><span class="tr"><span class="b" style="width:${Math.max(.6,r.v/mx*100)}%"></span></span><span class="val">${r.v.toFixed(3)}</span></div>`).join("");
}
function segOf(d){return d===1?"crit":d<=3?"high":d<=5?"mid":"low"}
function drawSeg(){
  const mx=D.deciles[0].churn;
  let h=`<thead><tr><th scope="col">${t("thDec")}</th><th scope="col" style="text-align:left">${t("thSeg")}</th><th scope="col">${t("thN")}</th><th scope="col">${t("thP")}</th><th scope="col">${t("thC")}</th><th scope="col">${t("thLift")}</th><th scope="col">${t("thCap")}</th></tr></thead><tbody>`;
  let prev=null;
  D.deciles.forEach(r=>{const s=segOf(r.d);const first=s!==prev;prev=s;
    const span=D.deciles.filter(x=>segOf(x.d)===s).length;
    h+=`<tr class="${s}"><td>${r.d}</td><td style="text-align:left">${first?`<span class="seg">${t("segs")[s]}</span>`:""}</td><td>${fmt(r.n)}</td><td>${fmt(r.p*100,1)}%</td><td>${fmt(r.churn*100,1)}%<span class="minibar" style="width:${Math.max(2,r.churn/mx*36)}px"></span></td><td>${fmt(r.lift,1)}×</td><td>${fmt(r.cap*100,0)}%</td></tr>`});
  document.getElementById("seg").innerHTML=h+"</tbody>";
  const rng={crit:"1",high:"2–3",mid:"4–5",low:"6–10"};
  document.getElementById("acts").innerHTML=["crit","high","mid","low"].map(k=>`<div class="arow ${k}" role="listitem"><span><span class="seg">${t("segs")[k]}</span><small>${t("thDec")} ${rng[k]}</small></span><span>${t("acts")[k]}</span></div>`).join("");
}
function drawRoc(){
  const box=document.getElementById("roc");box.innerHTML="";
  const W=Math.max(260,Math.min(box.clientWidth,360)),m={l:36,r:10,t:10,b:34},S=W-m.l-m.r,H=S+m.t+m.b;
  const svg=el("svg",{viewBox:`0 0 ${W} ${H}`,role:"img","aria-label":t("roc-t")+": AUC "+D.auc_gb},box);svg.style.maxWidth=W+"px";
  const x=v=>m.l+v*S,y=v=>m.t+S-v*S;
  for(let v=0;v<=1.001;v+=.25){el("line",{x1:x(0),x2:x(1),y1:y(v),y2:y(v),stroke:v?css("--grid"):css("--rule")},svg);el("text",{x:m.l-6,y:y(v)+4,"text-anchor":"end"},svg,v.toFixed(2));el("text",{x:x(v),y:H-18,"text-anchor":"middle"},svg,v.toFixed(2))}
  el("text",{x:m.l+S/2,y:H-3,"text-anchor":"middle"},svg,L==="es"?"Tasa de falsos positivos":"False positive rate");
  el("line",{x1:x(0),y1:y(0),x2:x(1),y2:y(1),stroke:css("--ink-3"),"stroke-dasharray":"3 3"},svg);
  const p=a=>a.map((q,k)=>(k?"L":"M")+x(q[0]).toFixed(1)+","+y(q[1]).toFixed(1)).join("");
  el("path",{d:p(D.roc_lr),fill:"none",stroke:css("--n3"),"stroke-width":1.8},svg);
  el("path",{d:p(D.roc),fill:"none",stroke:css("--accent"),"stroke-width":2.4},svg);
  const t1=el("text",{x:x(.38),y:y(.62),"font-size":"12"},svg,`${t("gb")} · AUC ${D.auc_gb.toFixed(3)}`);t1.style.fill=css("--accent");t1.style.fontWeight=600;
  const t2=el("text",{x:x(.38),y:y(.62)+16,"font-size":"12"},svg,`${t("lr")} · AUC ${D.auc_lr.toFixed(3)}`);t2.style.fill=css("--ink-2");
  el("text",{x:x(.62),y:y(.5)+14,"font-size":"11"},svg,t("chance"));
  const pts=D.roc;const dot=el("circle",{r:4,fill:css("--accent"),stroke:css("--bg"),"stroke-width":1.5,visibility:"hidden"},svg);
  hover(svg,W,x(0),x(1),101,(k,r)=>{const f=k/100;let best=pts[0];pts.forEach(q=>{if(Math.abs(q[0]-f)<Math.abs(best[0]-f))best=q});
    dot.setAttribute("cx",x(best[0]));dot.setAttribute("cy",y(best[1]));dot.setAttribute("visibility","visible");
    showTip(`${L==="es"?"Falsos positivos":"False positive rate"}: <b>${fmt(best[0]*100,1)}%</b><br>${L==="es"?"Verdaderos positivos":"True positive rate"}: <b>${fmt(best[1]*100,1)}%</b>`,r.left+x(best[0])*r.width/W,r.top+y(best[1])*r.width/W)},dot);
}

  <div class="h">${t("real")}: ${t("churnL")}</div><div class="tp" role="cell"><b>${fmt(c.tp)}</b><small>${t("tpL")}</small></div><div role="cell"><b>${fmt(c.fn)}</b><small>${t("fnL")}</small></div>
  <div class="h">${t("real")}: ${t("stayL")}</div><div role="cell"><b>${fmt(c.fp)}</b><small>${t("fpL")}</small></div><div role="cell"><b>${fmt(c.tn)}</b><small>${t("tnL")}</small></div>`;

function drawEcon(){
  const box=document.getElementById("econ");box.innerHTML="";
  const W=Math.max(300,box.clientWidth),narrow=W<520,m={l:narrow?52:60,r:narrow?10:16,t:14,b:36},H=narrow?250:280;
  const svg=el("svg",{viewBox:`0 0 ${W} ${H}`,role:"img","aria-label":t("econ-t")},box);
  const g=D.grid,ng=D.net_grid,n=g.length,iw=W-m.l-m.r,ih=H-m.t-m.b;
  const lo=-20000,hi=40000,x=s=>m.l+(s-g[0])/(g[n-1]-g[0])*iw,y=v=>m.t+ih-(v-lo)/(hi-lo)*ih;
  for(let v=lo;v<=hi;v+=10000){el("line",{x1:m.l,x2:W-m.r,y1:y(v),y2:y(v),stroke:v===0?css("--ink-3"):css("--grid"),"stroke-width":v===0?1.2:1},svg);el("text",{x:m.l-6,y:y(v)+4,"text-anchor":"end"},svg,(v>0?"+":v<0?"−":"")+fmt(Math.abs(v)/1000)+"k")}
  for(let s=0;s<=0.401;s+=narrow?0.1:0.05)el("text",{x:x(s),y:H-18,"text-anchor":"middle"},svg,Math.round(s*100)+"%");
  el("text",{x:m.l+iw/2,y:H-3,"text-anchor":"middle"},svg,t("save"));
  const asm=x(A.save);el("line",{x1:asm,x2:asm,y1:m.t,y2:m.t+ih,stroke:css("--ink-3"),"stroke-dasharray":"2 3"},svg);
  el("text",{x:asm+4,y:m.t+10,"font-size":"11"},svg,(L==="es"?"supuesto central ":"central assumption ")+A.save*100+"%");
  const p=a=>a.map((v,k)=>(k?"L":"M")+x(g[k]).toFixed(1)+","+y(v).toFixed(1)).join("");
  el("path",{d:p(ng.cash),fill:"none",stroke:css("--n2"),"stroke-width":2.2},svg);
  el("path",{d:p(ng.nudge),fill:"none",stroke:css("--accent"),"stroke-width":2.6},svg);
  [["nudge","--accent"],["cash","--n2"]].forEach(([k,c])=>{const be=D.breakeven[k];el("circle",{cx:x(be),cy:y(0),r:4.5,fill:css(c),stroke:css("--bg"),"stroke-width":1.5},svg);
    const tx=el("text",{x:x(be)+5,y:y(0)+17,"font-size":"11.5"},svg,`${t("be")} ${fmt(be*100,1)}%`);tx.style.fill=css(c==="--accent"?"--accent":"--ink-2");tx.style.fontWeight=600});
  const lg=document.createElement("div");lg.className="caption";lg.style.cssText="display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:6px";
  lg.innerHTML=`<span><i style="display:inline-block;width:14px;height:3px;background:var(--accent);vertical-align:middle;margin-right:6px"></i>${t("nudge")}</span><span><i style="display:inline-block;width:14px;height:3px;background:var(--n2);vertical-align:middle;margin-right:6px"></i>${t("cash")}</span>`;box.appendChild(lg);
  const cl=el("line",{y1:m.t,y2:m.t+ih,stroke:css("--ink-3"),visibility:"hidden"},svg);
  hover(svg,W,m.l,W-m.r,n,(k,r)=>{cl.setAttribute("x1",x(g[k]));cl.setAttribute("x2",x(g[k]));cl.setAttribute("visibility","visible");
    const sg=v=>(v<0?"−":"+")+"S/ "+fmt(Math.abs(v));
    showTip(`<b>${t("save")} ${Math.round(g[k]*100)}%</b><br>${t("nudge")}: <b>${sg(ng.nudge[k])}</b><br>${t("cash")}: <b>${sg(ng.cash[k])}</b>`,r.left+x(g[k])*r.width/W,r.top+y(ng.nudge[k])*r.width/W)},cl);
}
function applyText(){
  document.documentElement.lang=L;
  document.querySelectorAll("[data-i]").forEach(e=>{const k=e.dataset.i;if(k==="f-list")e.innerHTML=t("f").map(x=>`<li>${x}</li>`).join("");else if(typeof T[L][k]==="string")e.innerHTML=T[L][k]});
  const b=document.getElementById("lang");b.textContent=t("langBtn");b.setAttribute("aria-label",t("langAria"));

function charts(){hideTip();drawCoh();drawRoc();drawEcon()}
function render(){applyText();drawAnchors();drawImp();drawSeg();drawCm();charts()}
document.getElementById("lang").addEventListener("click",()=>{L=L==="es"?"en":"es";try{localStorage.setItem("lang",L)}catch(e){}render()});

window.matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change",charts);
