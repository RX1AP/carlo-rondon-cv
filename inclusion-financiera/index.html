 "cap-map":"Toca o pasa el cursor sobre un departamento para ver el valor exacto. Callao se muestra con un círculo porque su superficie es muy pequeña. Escala secuencial continua entre el mínimo y el máximo del indicador mostrado.",

 "cap-lines":"Cada año viene del reporte de diciembre de la SBS de ese año; 2019 sale de la columna Dic-19 del reporte de 2024. Toca el gráfico para ver los valores.",
 "h-table":"Tabla", "table-t":"Cambio 2019→2024 por departamento",
 thDep:"Departamento", thC19:"Cuenta 2019", thC24:"Cuenta 2024", thDc:"Cambio (pp)", thP19:"Puntos 2019", thP24:"Puntos 2024", thDp:"Puntos ×", thDi:"Distritos con punto, 2024",
 "h-read":"Lectura",
 "r1-t":"Qué muestran los datos",
 r1:"La inclusión creció en todos los departamentos, pero a ritmos muy distintos. El promedio nacional sumó 16.6 puntos y la distancia entre extremos se amplió de 24.0 a 35.9 puntos; la dispersión entre departamentos subió de 6.9 a 9.1 puntos. La red física llegó: el porcentaje de distritos sin ningún punto de atención cayó de 14.7% a 5.6%, y los puntos por adulto se multiplicaron en la sierra y la selva mientras en Lima se quedaron quietos. <strong>Pero llegar no fue suficiente</strong>: entre los departamentos donde más creció la red y los que más ganaron cuentas la relación es negativa (correlación de −0.42, sin Callao, calculada). Puno y Madre de Dios tienen hoy más puntos de atención por adulto que Lima y menos de la mitad de sus adultos con cuenta.",
 "r2-t":"Qué no muestran",
 r2:"<strong>No muestran el uso de billeteras por departamento.</strong> INEI y SBS solo lo publican a nivel nacional (46.4% de adultos en 2024 según la SBS) o por condición de pobreza; medirlo por región requiere procesar los microdatos de la ENAHO, que queda como siguiente paso. Por eso esta pieza no puede probar si las billeteras cerraron la brecha más rápido que la red física. La tenencia de cuentas es autorreportada en una encuesta con muestra limitada por departamento, y no mide si la cuenta se usa ni con qué frecuencia. Los puntos de atención cuentan cada agente por entidad: una bodega que atiende a tres bancos suma tres. Cada año sale de un reporte distinto de la SBS, que puede actualizar la población de referencia. La correlación es descriptiva, con 24 observaciones.",
 "r3-t":"Qué implica para quien vende pagos",
 r3:"En Lima y la costa el acceso ya está resuelto para dos de cada tres adultos: ahí se compite por uso, con pagos, crédito y servicios al comercio. En el altiplano y la selva el problema no es presencia sino conversión. Ya hay agentes en casi todos los distritos, pero la gente no abre ni usa cuentas. El producto que gana ahí no es otra red física. Es lo que convierte al agente en puerta de entrada: apertura de cuenta con DNI en el punto, cash-in y cash-out baratos, cobro con QR que el bodeguero liquida en el momento y recaudación de servicios. <strong>Puno, Madre de Dios, Ucayali y Apurímac</strong> (menos de 45% de adultos con cuenta), y Loreto (49.6%), son el mercado desatendido más claro, con la infraestructura ya instalada.",
 "f-t":"Fuentes y notas",
 f:[
  `Fuente principal: SBS, <em>Perú: Reporte de Indicadores de Inclusión Financiera</em> (código CIIF-0001), reportes de diciembre: <a href="${SBS(2020)}" target="_blank" rel="noopener">2020</a>, <a href="${SBS(2021)}" target="_blank" rel="noopener">2021</a>, <a href="${SBS(2022)}" target="_blank" rel="noopener">2022</a>, <a href="${SBS(2023)}" target="_blank" rel="noopener">2023</a>, <a href="${SBS(2024)}" target="_blank" rel="noopener">2024</a>. Consulta: 24 de octubre de 2026. Periodo: diciembre 2019 a diciembre 2024.`,
  "Adultos con cuenta: tabla «Indicadores de uso de los servicios financieros por departamento», columna «Tenencia de cuentas (%)», fuente INEI – Encuesta Nacional de Hogares (ENAHO), población de 18 años y más, tal como la publica la SBS.",
  "Puntos de atención: tabla «Disponibilidad de la red de atención del sistema financiero por departamento», N° de puntos de atención por cada 100 mil habitantes adultos (oficinas + cajeros automáticos + cajeros corresponsales). La normalización por población adulta es la de la SBS; no se recalculó.",

  "Calculado (marcado con «calculado»): cambio en puntos porcentuales, multiplicador de puntos de atención, brecha entre máximo y mínimo, desviación estándar entre departamentos y correlación de Pearson entre el multiplicador de puntos y el cambio en cuentas (24 departamentos, sin Callao).",
  "Billeteras: 46.4% de adultos a nivel nacional, diciembre 2024, del mismo reporte SBS. No hay dato por departamento publicado: el mapa lo marca como «sin dato».",
  "Mapa: límites departamentales del repositorio público <a href=\"https://github.com/juaneladio/peru-geojson\" target=\"_blank\" rel=\"noopener\">peru-geojson</a>, simplificados para la web. Callao se dibuja con un círculo para que sea visible.",
  "Véase también el <a href=\"https://www.inei.gob.pe\" target=\"_blank\" rel=\"noopener\">INEI</a> para la ENAHO y sus microdatos."

en:{
 back:"← Carlo Rondón",
 eyebrow:"Financial inclusion · Peru · 2019–2024",
 h1:"More Peruvians have an account than in 2019, but the gap between regions widened: agents reached the highlands and the Amazon, and accounts did not follow",
 dek:"Between 2019 and 2024 the share of adults with an account rose from 40.8% to 57.4%. Over the same period, the gap between the most and least included department grew from 24.0 to <b>35.9 points</b>. Puno tripled its access points, and its account ownership rose just 5.5 points.",
 byline:"By Carlo Rondón · Fintech & Payments Strategy · SBS and INEI (ENAHO) data",
 "h-anchors":"The period in figures",
 a1l:"gap between the department with the most and fewest adults with an account, 2024", a1d:"Callao 69.3% vs. Puno 33.4%. It was 24.0 pp in 2019",
 a2l:"adults with an account nationwide", a2d:"from 40.8% (2019) to 57.4% (2024)",
 a3l:"access points in Puno per 100,000 adults", a3d:"from 402 to 1,258. Its accounts rose 5.5 pp",
 a4l:"of districts with no access point at all in 2024", a4d:"14.7% in 2019",
 "h-map":"Map",
 mCta:"Adults with an account", mPa:"Access points", mD:"Change in accounts 2019→2024", mW:"Wallet use",

 readCta:"<strong>Lima, Callao, Moquegua and Arequipa are above 64%</strong>. Puno (33.4%) and Madre de Dios (36.0%) remain below where the country stood in 2019. The southern coast and the centre advanced; the altiplano and the southern Amazon fell behind.",
 readPa:"The network grew mostly outside Lima. <strong>Lima went from 1,162 to 1,188 points per 100,000 adults (+2%)</strong>; Huancavelica, from 704 to 2,499. Nearly all of it is agent network (cajeros corresponsales): bank branches fell from 21 to 16 per 100,000 adults nationwide.",
 readD:"<strong>Cusco (+28.1 pp) and Junín (+23.9 pp)</strong> advanced the most. Those that advanced least, Puno (+5.5), Madre de Dios (+8.7) and Loreto (+9.0), are among those that multiplied their access points the most (Madre de Dios ×5.2, Puno ×3.1, Loreto ×2.6).",
 "cap-map":"Tap or hover over a department to see the exact value. Callao is shown as a circle because its area is very small. Continuous sequential scale between the minimum and maximum of the indicator shown.",
 "h-rank":"Ranking",
 rankT:(m,y)=>`${m}, ${y}: highest to lowest`,
 refLima:"Lima",
 "cap-rank":"The dotted line marks Lima's value as a reference. The blue bar is Lima.",
 "h-lines":"Over time",

 "h-table":"Table", "table-t":"Change 2019→2024 by department",
 thDep:"Department", thC19:"Account 2019", thC24:"Account 2024", thDc:"Change (pp)", thP19:"Points 2019", thP24:"Points 2024", thDp:"Points ×", thDi:"Districts with a point, 2024",
 "h-read":"Reading",
 "r1-t":"What the data show",
 r1:"Inclusion grew in every department, but at very different speeds. The national average gained 16.6 points and the distance between extremes widened from 24.0 to 35.9 points; dispersion across departments rose from 6.9 to 9.1 points. The physical network arrived: the share of districts with no access point fell from 14.7% to 5.6%, and points per adult multiplied in the highlands and the Amazon while Lima stood still. <strong>But arriving was not enough</strong>: between the departments where the network grew most and those that gained the most accounts the relationship is negative (correlation of −0.42, excluding Callao, calculated). Puno and Madre de Dios now have more access points per adult than Lima and fewer than half of their adults with an account.",
 "r2-t":"What they do not show",
 r2:"<strong>They do not show wallet use by department.</strong> INEI and SBS publish it only nationally (46.4% of adults in 2024 per the SBS) or by poverty status; measuring it by region requires processing ENAHO microdata, which is the next step. So this piece cannot prove whether wallets closed the gap faster than the physical network. Account ownership is self-reported in a survey with limited sample per department, and it does not measure whether the account is used or how often. Access points count each agent per institution: a corner shop serving three banks counts three times. Each year comes from a different SBS report, which may update the reference population. The correlation is descriptive, with 24 observations.",
 "r3-t":"What it means for people who sell payments",
 r3:"In Lima and the coast, access is already solved for two out of three adults: competition there is about usage, with payments, credit and merchant services. In the altiplano and the Amazon the problem is not presence but conversion. There are agents in almost every district, but people do not open or use accounts. The product that wins there is not another physical network. It is whatever turns the agent into a front door: account opening with a national ID at the point, cheap cash-in and cash-out, QR collection the shopkeeper settles on the spot, and bill collection. <strong>Puno, Madre de Dios, Ucayali and Apurímac</strong> (under 45% of adults with an account), plus Loreto (49.6%), are the clearest underserved market, with the infrastructure already in place.",
 "f-t":"Sources and notes",

  "Districts with presence: table «Distribución del número de distritos con acceso a puntos de atención», December 2024 report (Dec-19 and Dec-24 columns).",

  "Wallets: 46.4% of adults nationwide, December 2024, from the same SBS report. No department-level figure is published: the map marks it «no data».",
  "Map: department boundaries from the public <a href=\"https://github.com/juaneladio/peru-geojson\" target=\"_blank\" rel=\"noopener\">peru-geojson</a> repository, simplified for the web. Callao is drawn as a circle so it is visible.",

let L="es";
try{const s=localStorage.getItem("lang");if(s==="en"||s==="es")L=s}catch(e){}
try{const q=new URLSearchParams(location.search).get("lang")||location.hash.slice(1);if(q==="en"||q==="es")L=q}catch(e){}
const t=k=>T[L][k];
const fmt=(v,d=0)=>v==null?null:v.toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const NS="http://www.w3.org/2000/svg";
function el(tag,a,p,txt){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;if(p)p.appendChild(e);return e}
const tip=document.getElementById("tip");
function showTip(html,cx,cy){tip.innerHTML=html;tip.hidden=false;const w=tip.offsetWidth,h=tip.offsetHeight,vw=document.documentElement.clientWidth;
  let l=cx+window.scrollX-w/2;l=Math.max(window.scrollX+8,Math.min(l,window.scrollX+vw-w-8));
  let tp=cy+window.scrollY-h-12; if(tp<window.scrollY+4) tp=cy+window.scrollY+16;
  tip.style.left=l+"px";tip.style.top=tp+"px"}
function hideTip(){tip.hidden=true}

const N=D.deps.length, LIMA=D.deps.indexOf("LIMA"), CALLAO=D.deps.indexOf("CALLAO");
const nm=i=>D.names[D.deps[i]];
let metric="cta", year="2024", focus=null;
function values(){ if(metric==="cta")return D.cta[year]; if(metric==="pa")return D.pa[year];
  return D.cta["2024"].map((v,i)=>+(v-D.cta["2019"][i]).toFixed(1)); }
function unit(v){ if(v==null)return t("noData"); if(metric==="cta")return fmt(v,1)+"%"; if(metric==="pa")return fmt(v,0); return (v>0?"+":"")+fmt(v,1)+" pp"; }
function mlabel(){return metric==="cta"?t("mCta"):metric==="pa"?t("mPa"):t("mD")}
const RAMP=["--q0","--q1","--q2","--q3","--q4"];
function hex2rgb(h){h=h.replace("#","");if(h.length===3)h=h.split("").map(c=>c+c).join("");return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16))}
function color(v,min,max){const stops=RAMP.map(r=>hex2rgb(css(r)));let f=(v-min)/((max-min)||1)*(stops.length-1);f=Math.max(0,Math.min(stops.length-1,f));
  const i=Math.min(stops.length-2,Math.floor(f)),u=f-i;const c=stops[i].map((a,k)=>Math.round(a+(stops[i+1][k]-a)*u));return `rgb(${c})`}

/* controls */
function drawControls(){
  const mc=document.getElementById("metricCtl"); mc.setAttribute("aria-label",L==="es"?"Indicador":"Indicator");
  mc.innerHTML="";
  [["cta","mCta"],["pa","mPa"],["d","mD"]].forEach(([k,l])=>{const b=document.createElement("button");b.className="chip";b.type="button";b.textContent=t(l)+(k==="d"?" ·":"");if(k==="d"){const s=document.createElement("span");s.className="calc-tag";s.textContent=t("calc");s.style.color="inherit";s.style.borderColor="currentColor";b.appendChild(s)}
    b.setAttribute("aria-pressed",metric===k);b.onclick=()=>{metric=k;renderCharts()};mc.appendChild(b)});
  const w=document.createElement("button");w.className="chip";w.type="button";w.disabled=true;w.textContent=t("mW")+" · "+t("noData");w.title=t("mWtitle");w.setAttribute("aria-label",t("mW")+": "+t("mWtitle"));mc.appendChild(w);
  const yc=document.getElementById("yearCtl"); yc.setAttribute("aria-label",L==="es"?"Año":"Year"); yc.innerHTML="";
  D.years.forEach(y=>{const b=document.createElement("button");b.className="chip num";b.type="button";b.textContent=y;b.disabled=metric==="d";
    b.setAttribute("aria-pressed",metric!=="d"&&year===String(y));b.onclick=()=>{year=String(y);renderCharts()};yc.appendChild(b)});
}

/* map */
function drawMap(){
  const box=document.getElementById("map");box.innerHTML="";
  const v=values(),min=Math.min(...v),max=Math.max(...v);
  const {w,h,paths,cent}=D.map;
  const svg=el("svg",{viewBox:`-6 -6 ${w+12} ${h+12}`,role:"group","aria-label":document.getElementById("map-title").textContent},box);
  D.deps.forEach((d,i)=>{
    if(i===CALLAO)return;
    const p=el("path",{d:paths[d],class:"dep"+(focus===i?" on":""),fill:color(v[i],min,max),tabindex:0,role:"img","aria-label":`${nm(i)}: ${unit(v[i])}`},svg);
    bindTip(p,i,v);
  });
  // Callao circle callout
  const [cx,cy]=cent.CALLAO, ox=cx-34, oy=cy+6;
  el("line",{x1:cx,y1:cy,x2:ox+7,y2:oy,stroke:css("--ink-3"),"stroke-width":.8},svg);
  const c=el("circle",{cx:ox,cy:oy,r:7,class:"dep"+(focus===CALLAO?" on":""),fill:color(v[CALLAO],min,max),stroke:css("--ink-3"),"stroke-width":.8,tabindex:0,role:"img","aria-label":`Callao: ${unit(v[CALLAO])}`},svg);
  c.style.cursor="pointer";bindTip(c,CALLAO,v);
  el("text",{x:ox-10,y:oy+4,"text-anchor":"end"},svg,"Callao");
  // labels for extremes
  const lo=v.indexOf(min),hi=v.indexOf(max);
  // legend
  const lg=document.getElementById("legend");
  const grad=RAMP.map(r=>css(r)).join(",");
  lg.innerHTML=`<div class="bar" style="background:linear-gradient(90deg,${grad})" aria-hidden="true"></div><div class="ticks"><span>${unit(min)} · ${nm(lo)}</span><span>${unit(max)} · ${nm(hi)}</span></div>`;
}
function bindTip(node,i,v){
  const html=()=>{let s=`<b>${nm(i)}</b><br>${mlabel()}: <b>${unit(v[i])}</b>`;
    if(metric!=="d") s+=`<br>${L==="es"?"Lima":"Lima"}: ${unit(v[LIMA])}`;
    if(metric==="pa"){s+=`<br>2019 → 2024: ${fmt(D.pa["2019"][i])} → ${fmt(D.pa["2024"][i])}`}
    if(metric==="cta"||metric==="d"){s+=`<br>2019 → 2024: ${fmt(D.cta["2019"][i],1)}% → ${fmt(D.cta["2024"][i],1)}%`}
    return s};
  const show=e=>{focus=i;if(node.tagName==="path")node.parentNode.appendChild(node);const r=node.getBoundingClientRect();showTip(html(),r.left+r.width/2,r.top+Math.min(r.height/2,30));markFocus()};
  node.addEventListener("pointerenter",show);node.addEventListener("pointerdown",show);node.addEventListener("focus",show);
  node.addEventListener("pointerleave",()=>{hideTip()});node.addEventListener("blur",hideTip);
}
function markFocus(){document.querySelectorAll("#map .dep").forEach(n=>n.classList.remove("on"));
  document.querySelectorAll(".rrow").forEach(r=>r.classList.toggle("on",+r.dataset.i===focus))}

/* ranking */
function drawRank(){
  const v=values(), max=Math.max(...v), box=document.getElementById("rank");box.innerHTML="";
  const order=[...v.keys()].sort((a,b)=>v[b]-v[a]);
  const refPct=v[LIMA]/max*100;
  order.forEach(i=>{const r=document.createElement("div");r.className="rrow"+(i===LIMA?" lima":"");r.dataset.i=i;r.setAttribute("role","listitem");
    r.innerHTML=`<span class="nm">${nm(i)}</span><span class="tr"><span class="b" style="width:${Math.max(.5,v[i]/max*100)}%"></span><span class="ref" style="left:${refPct}%"></span></span><span class="val">${unit(v[i])}</span>`;
    r.addEventListener("pointerenter",()=>{focus=i;markFocus()});box.appendChild(r)});
}

/* lines */
const SEL=["LIMA","CUSCO","HUANCAVELICA","PUNO"];
const SCOL={LIMA:"--n1",CUSCO:"--n2",HUANCAVELICA:"--n3",PUNO:"--accent"};
function drawLines(){
  const box=document.getElementById("lines");box.innerHTML="";
  const lm=metric==="d"?"cta":metric; const src=lm==="cta"?D.cta:D.pa, nac=lm==="cta"?D.ctaNac:D.paNac;
  document.getElementById("lines-title").textContent=t("linesT")(lm==="cta"?t("mCta")+" (%)":t("mPa")+(L==="es"?" por 100 mil adultos":" per 100,000 adults"));
  const W=Math.max(300,box.clientWidth), narrow=W<520, m={l:narrow?36:42,r:narrow?92:110,t:12,b:24}, H=narrow?240:280;
  const svg=el("svg",{viewBox:`0 0 ${W} ${H}`,role:"img","aria-label":document.getElementById("lines-title").textContent},box);
  const yrs=D.years, iw=W-m.l-m.r, ih=H-m.t-m.b;
  const all=SEL.flatMap(d=>yrs.map(y=>src[y][D.deps.indexOf(d)])).concat(yrs.map(y=>nac[y]));
  const ymax=lm==="cta"?80:3000, ymin=lm==="cta"?20:0, step=lm==="cta"?10:500;
  const x=k=>m.l+k/(yrs.length-1)*iw, y=v=>m.t+ih-(v-ymin)/(ymax-ymin)*ih;
  for(let v=ymin;v<=ymax;v+=step){el("line",{x1:m.l,x2:W-m.r,y1:y(v),y2:y(v),stroke:v===ymin?css("--rule"):css("--grid")},svg);el("text",{x:m.l-6,y:y(v)+4,"text-anchor":"end"},svg,fmt(v)+(lm==="cta"?"%":""))}
  yrs.forEach((yy,k)=>el("text",{x:x(k),y:H-6,"text-anchor":"middle"},svg,narrow?"’"+String(yy).slice(2):yy));
  // national dashed
  el("path",{d:yrs.map((yy,k)=>(k?"L":"M")+x(k)+","+y(nac[yy])).join(""),fill:"none",stroke:css("--ink-3"),"stroke-width":1.5,"stroke-dasharray":"4 4"},svg);
  const ends=[];
  SEL.forEach(d=>{const i=D.deps.indexOf(d),col=css(SCOL[d]);
    el("path",{d:yrs.map((yy,k)=>(k?"L":"M")+x(k)+","+y(src[yy][i])).join(""),fill:"none",stroke:col,"stroke-width":d==="PUNO"?2.6:2,"stroke-linejoin":"round"},svg);
    const lv=src[yrs[yrs.length-1]][i]; el("circle",{cx:x(yrs.length-1),cy:y(lv),r:3.5,fill:col,stroke:css("--bg"),"stroke-width":1.5},svg);
    ends.push({label:`${nm(i)} ${unit2(lv,lm)}`,y:y(lv),col,acc:d==="PUNO"})});
  ends.push({label:`${t("nac")} ${unit2(nac[yrs[yrs.length-1]],lm)}`,y:y(nac[yrs[yrs.length-1]]),col:css("--ink-3")});
  ends.sort((a,b)=>a.y-b.y);for(let k=1;k<ends.length;k++)if(ends[k].y-ends[k-1].y<14)ends[k].y=ends[k-1].y+14;
  ends.forEach(e=>{const tx=el("text",{x:W-m.r+8,y:e.y+4,"font-size":"11.5"},svg,e.label);tx.style.fill=e.acc?css("--accent"):css("--ink-2");if(e.acc)tx.style.fontWeight=600});
  // hover
  const cl=el("line",{y1:m.t,y2:m.t+ih,stroke:css("--ink-3"),visibility:"hidden"},svg);
  const hit=el("rect",{x:m.l,y:0,width:iw,height:H,fill:"transparent"},svg);
  const mv=ev=>{const r=svg.getBoundingClientRect();const sx=(ev.clientX-r.left)*W/r.width;let k=Math.round((sx-m.l)/iw*(yrs.length-1));k=Math.max(0,Math.min(yrs.length-1,k));
    cl.setAttribute("x1",x(k));cl.setAttribute("x2",x(k));cl.setAttribute("visibility","visible");const yy=yrs[k];
    let s=`<b>${yy}</b>`;SEL.forEach(d=>{s+=`<br>${nm(D.deps.indexOf(d))}: <b>${unit2(src[yy][D.deps.indexOf(d)],lm)}</b>`});s+=`<br>${t("nac")}: <b>${unit2(nac[yy],lm)}</b>`;
    showTip(s,r.left+x(k)*r.width/W,r.top+m.t*r.width/W+10)};
  hit.addEventListener("pointermove",mv);hit.addEventListener("pointerdown",mv);hit.addEventListener("pointerleave",()=>{cl.setAttribute("visibility","hidden");hideTip()});
}
function unit2(v,lm){return lm==="cta"?fmt(v,1)+"%":fmt(v,0)}

/* table */
let sortKey="dc", sortDir=-1;
function drawTable(){
  const rows=D.deps.map((d,i)=>({i,name:nm(i),c19:D.cta["2019"][i],c24:D.cta["2024"][i],dc:D.cta["2024"][i]-D.cta["2019"][i],p19:D.pa["2019"][i],p24:D.pa["2024"][i],dp:D.pa["2024"][i]/D.pa["2019"][i],di:D.dist["2024"][i]}));
  rows.sort((a,b)=>sortKey==="name"?a.name.localeCompare(b.name,"es")*sortDir*-1:(a[sortKey]-b[sortKey])*sortDir);
  const cols=[["name","thDep"],["c19","thC19"],["c24","thC24"],["dc","thDc",1],["p19","thP19"],["p24","thP24"],["dp","thDp",1],["di","thDi"]];
  let h="<caption class=\"caption\" style=\"text-align:left;caption-side:bottom;padding-top:8px\"></caption><thead><tr>"+cols.map(([k,l,c])=>`<th scope="col" aria-sort="${sortKey===k?(sortDir<0?"descending":"ascending"):"none"}"><button type="button" data-k="${k}">${t(l)}${c?`<span class="calc-tag">${t("calc")}</span>`:""}${sortKey===k?(sortDir<0?" ↓":" ↑"):""}</button></th>`).join("")+"</tr></thead><tbody>";
  rows.forEach(r=>{h+=`<tr${r.i===LIMA?' style="color:var(--accent)"':''}><td>${r.name}</td><td>${fmt(r.c19,1)}%</td><td>${fmt(r.c24,1)}%</td><td class="calc">+${fmt(r.dc,1)}</td><td>${fmt(r.p19)}</td><td>${fmt(r.p24)}</td><td class="calc">×${fmt(r.dp,1)}</td><td>${fmt(r.di,1)}%</td></tr>`});
  const n=D.ctaNac,p=D.paNac;
  h+=`<tr class="nac"><td>${t("nac")}</td><td>${fmt(n["2019"],1)}%</td><td>${fmt(n["2024"],1)}%</td><td>+${fmt(n["2024"]-n["2019"],1)}</td><td>${fmt(p["2019"])}</td><td>${fmt(p["2024"])}</td><td>×${fmt(p["2024"]/p["2019"],1)}</td><td>${fmt(D.distNac["2024"],1)}%</td></tr></tbody>`;
  const tb=document.getElementById("table");tb.innerHTML=h;
  tb.querySelectorAll("th button").forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(sortKey===k)sortDir*=-1;else{sortKey=k;sortDir=k==="name"?1:-1}drawTable()});
}

function drawAnchors(){
  const items=[["35.9 pp",true,"a1l","a1d"],["+16.6 pp",false,"a2l","a2d"],["×3.1",false,"a3l","a3d"],["5.6%",false,"a4l","a4d"]];
  document.getElementById("anchors").innerHTML=items.map(([v,a,l,d])=>`<div class="anchor"><span class="v${a?" acc":""}">${v}</span><span class="l">${t(l)}</span><span class="d">${t(d)}</span></div>`).join("");
}
function renderCharts(){
  hideTip();
  document.getElementById("map-title").textContent=metric==="cta"?t("tCta")(year):metric==="pa"?t("tPa")(year):t("tD");
  document.getElementById("rank-title").textContent=t("rankT")(mlabel(),metric==="d"?"2019→2024":year);
  document.getElementById("map-read").innerHTML=metric==="cta"?t("readCta"):metric==="pa"?t("readPa"):t("readD");
  drawControls();drawMap();drawRank();drawLines();
}
function applyText(){
  document.documentElement.lang=L;
  document.querySelectorAll("[data-i]").forEach(e=>{const k=e.dataset.i;if(k==="f-list")e.innerHTML=t("f").map(x=>`<li>${x}</li>`).join("");else if(typeof T[L][k]==="string")e.innerHTML=T[L][k]});
  const b=document.getElementById("lang");b.textContent=t("langBtn");b.setAttribute("aria-label",t("langAria"));
  document.title=L==="es"?"Inclusión financiera por región en Perú, 2019–2024 · Carlo Rondón":"Financial inclusion by region in Peru, 2019–2024 · Carlo Rondón";
}
function render(){applyText();drawAnchors();renderCharts();drawTable()}
document.getElementById("lang").addEventListener("click",()=>{L=L==="es"?"en":"es";try{localStorage.setItem("lang",L)}catch(e){}render()});
let rz;window.addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{hideTip();drawLines()},120)});
window.matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change",renderCharts);
document.addEventListener("pointerdown",e=>{if(!e.target.closest(".map,.lines"))hideTip()});
render();
</script>
</body>
